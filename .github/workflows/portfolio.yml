name: Portfolio CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check public surface
        run: |
          if [ -n "$(git ls-files site/src/content/projects-cn)" ]; then
            echo "site/src/content/projects-cn is private source material and must not be published on main"
            exit 1
          fi
          for path in projects research design; do
            if [ -n "$(git ls-files "$path")" ]; then
              echo "private path '$path' must not be published on main"
              exit 1
            fi
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix site
          python3 -m pip install Pillow==12.3.0

      - name: Verify site
        run: npm --prefix site run verify:all
